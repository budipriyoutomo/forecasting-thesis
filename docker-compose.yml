version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-slim
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./frontend/.env.local

  # Postgres lokal untuk dev/test — di production dipakai Supabase.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forecastiq
      POSTGRES_PASSWORD: forecastiq
      POSTGRES_DB: forecastiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
